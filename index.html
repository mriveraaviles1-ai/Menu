<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quiosco de Marcos — Menú</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:  #0a0a0a;
      --dark:   #111111;
      --card:   #161616;
      --yellow: #FFD600;
      --gold:   #E8B800;
      --white:  #F5F5F5;
      --gray:   #777777;
      --border: rgba(255,214,0,0.12);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }

    /* ── LOADING ── */
    #loading {
      position: fixed; inset: 0; background: var(--black);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 1000; transition: opacity .4s;
    }
    #loading.gone { opacity: 0; pointer-events: none; }
    .load-logo {
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--yellow); color: var(--black);
      font-size: 22px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      animation: breathe 1.6s ease-in-out infinite;
    }
    .load-text { color: var(--gray); font-size: 11px; letter-spacing: 3px; margin-top: 16px; }
    @keyframes breathe { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.08);opacity:.7} }

    /* ── ADMIN BAR ── */
    #adminBar {
      display: none; position: fixed; top: 0; left: 0; right: 0; height: 44px;
      background: var(--yellow); color: var(--black);
      padding: 0 16px; align-items: center; justify-content: space-between;
      z-index: 600; font-size: 13px; font-weight: 700;
    }
    body.admin #adminBar { display: flex; }
    body.admin header { padding-top: 60px; }
    .ab-btns { display: flex; gap: 8px; }
    .ab-save {
      background: var(--black); color: var(--yellow);
      border: none; border-radius: 6px; padding: 6px 14px;
      font-size: 12px; font-weight: 800; cursor: pointer;
    }
    .ab-exit {
      background: transparent; border: none; font-size: 12px;
      color: rgba(0,0,0,.55); cursor: pointer; font-weight: 600;
    }

    /* ── HEADER ── */
    header {
      background: var(--black); padding: 28px 20px 18px;
      text-align: center; border-bottom: 2px solid var(--yellow);
    }
    .logo-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 6px; }
    .logo-circle {
      width: 54px; height: 54px; border-radius: 50%;
      background: var(--yellow); color: var(--black);
      font-size: 18px; font-weight: 900;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .brand { font-size: 24px; font-weight: 900; letter-spacing: 3px; color: var(--yellow); text-transform: uppercase; }
    .sub { font-size: 10px; letter-spacing: 4px; color: var(--gray); text-transform: uppercase; margin-bottom: 14px; }
    .hours { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .hbadge {
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px; padding: 5px 14px; font-size: 12px; color: var(--gray);
    }
    .hbadge strong { color: var(--yellow); }

    /* ── STATUS BAR ── */
    #statusBar {
      background: var(--dark); padding: 6px 16px;
      font-size: 11px; color: var(--gray); text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .sdot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: #888; vertical-align: middle; margin-right: 5px;
      transition: background .4s;
    }
    .sdot.live { background: #4caf50; }

    /* ── NAV ── */
    .nav-wrap {
      position: sticky; top: 0; z-index: 500;
      background: var(--dark); border-bottom: 1px solid var(--border);
      overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .nav-wrap::-webkit-scrollbar { display: none; }
    body.admin .nav-wrap { top: 44px; }
    nav { display: flex; padding: 0 6px; white-space: nowrap; }
    .nbtn {
      background: none; border: none; color: var(--gray);
      padding: 13px 15px; font-size: 12px; font-weight: 600; letter-spacing: .3px;
      cursor: pointer; border-bottom: 2.5px solid transparent; transition: all .2s;
      white-space: nowrap; flex-shrink: 0;
    }
    .nbtn.on { color: var(--yellow); border-bottom-color: var(--yellow); }
    .nbtn .ni { margin-right: 4px; }

    /* ── MAIN ── */
    main { padding-bottom: 90px; }

    .section { padding: 0 18px 4px; }

    .sec-hdr {
      display: flex; align-items: center; gap: 12px;
      padding: 22px 0 10px; border-bottom: 1px solid var(--border); margin-bottom: 2px;
    }
    .sec-emoji { font-size: 22px; }
    .sec-title { font-size: 21px; font-weight: 900; letter-spacing: 2px; color: var(--yellow); text-transform: uppercase; }

    .sublabel {
      font-size: 10px; font-weight: 700; letter-spacing: 3px;
      color: var(--gray); text-transform: uppercase; padding: 14px 0 6px;
    }

    /* ── ITEM ── */
    .item {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 13px 0; border-bottom: 1px solid var(--border); gap: 10px;
    }
    .item:last-child { border-bottom: none; }
    .iL { flex: 1; min-width: 0; }
    .inr { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .iname {
      font-size: 15px; font-weight: 700; color: var(--white); line-height: 1.35;
      transition: color .15s;
    }
    .idesc { font-size: 12px; color: var(--gray); font-style: italic; margin-top: 2px; }
    .tbadge {
      display: inline-flex; align-items: center; gap: 3px;
      background: var(--yellow); color: var(--black);
      font-size: 9px; font-weight: 800; padding: 2px 7px;
      border-radius: 4px; letter-spacing: .5px; flex-shrink: 0; cursor: default;
    }
    .iprice {
      font-size: 17px; font-weight: 800; color: var(--yellow);
      white-space: nowrap; flex-shrink: 0; align-self: center;
      transition: color .15s;
    }

    /* Admin edit hints */
    body.admin .iname  { border-bottom: 1.5px dashed rgba(255,214,0,.35); cursor: pointer; }
    body.admin .iprice { border-bottom: 1.5px dashed var(--yellow); cursor: pointer; }
    body.admin .tbadge { cursor: pointer; }
    body.admin .iname:active,
    body.admin .iprice:active { color: var(--yellow); }

    /* ── FABs ── */
    .fab {
      position: fixed; bottom: 24px; width: 48px; height: 48px;
      border-radius: 50%; border: none; display: flex; align-items: center;
      justify-content: center; font-size: 20px; cursor: pointer; z-index: 400;
      transition: transform .15s;
    }
    .fab:active { transform: scale(.88); }
    #fabAdmin {
      left: 20px; background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12); color: var(--gray);
    }
    #fabTop { right: 20px; background: var(--yellow); color: var(--black); }

    /* ── MODALS ── */
    .mbd {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.82); z-index: 700; align-items: flex-end;
    }
    .mbd.open { display: flex; }
    .mbox {
      background: #1c1c1c; border-radius: 22px 22px 0 0;
      padding: 26px 20px 44px; width: 100%; max-height: 85vh; overflow-y: auto;
    }
    .mbox h2 { font-size: 17px; font-weight: 800; color: var(--yellow); margin-bottom: 18px; }
    .mbox input[type=text],
    .mbox input[type=password],
    .mbox input[type=number] {
      width: 100%; background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.14); border-radius: 12px;
      padding: 14px 16px; font-size: 16px; color: var(--white);
      margin-bottom: 12px; outline: none; -webkit-appearance: none;
    }
    .mbox input:focus { border-color: var(--yellow); }
    .btn-y {
      width: 100%; background: var(--yellow); color: var(--black);
      border: none; border-radius: 12px; padding: 15px;
      font-size: 16px; font-weight: 800; cursor: pointer; margin-bottom: 8px;
    }
    .btn-c {
      width: 100%; background: transparent; color: var(--gray);
      border: 1px solid rgba(255,255,255,.1); border-radius: 12px;
      padding: 15px; font-size: 15px; cursor: pointer;
    }
    .err-msg { color: #ff6b6b; font-size: 13px; text-align: center; margin-bottom: 10px; display: none; }

    /* Toggle TOP row in edit modal */
    .top-toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0 18px; font-size: 14px; color: var(--gray);
    }
    .switch { position: relative; width: 44px; height: 26px; display: inline-block; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; background: #333; border-radius: 26px; cursor: pointer; transition: .3s;
    }
    .slider:before {
      content: ''; position: absolute; width: 20px; height: 20px;
      left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .3s;
    }
    input:checked + .slider { background: var(--yellow); }
    input:checked + .slider:before { transform: translateX(18px); }

    /* Delete item button */
    .btn-del {
      width: 100%; background: transparent; color: #ff4444;
      border: 1px solid rgba(255,68,68,.3); border-radius: 12px;
      padding: 13px; font-size: 14px; cursor: pointer; margin-top: 6px;
    }

    /* Add item button */
    .add-item-btn {
      display: none; width: 100%; background: transparent;
      border: 1px dashed rgba(255,214,0,.3); border-radius: 10px;
      padding: 12px; color: rgba(255,214,0,.6); font-size: 13px;
      font-weight: 600; cursor: pointer; margin-top: 10px; text-align: center;
    }
    body.admin .add-item-btn { display: block; }
    .add-item-btn:active { border-color: var(--yellow); color: var(--yellow); }
  </style>
</head>

<!-- MENU -->
<main id="main"></main>

<!-- FABs -->
<button class="fab" id="fabAdmin" onclick="adminTap()" title="Admin">⚙️</button>
<button class="fab" id="fabTop" onclick="scrollTop()">↑</button>

<!-- PASSWORD MODAL -->
<div class="mbd" id="mPwd">

  </div>

<!-- EDIT ITEM MODAL -->
<div class="mbd" id="mEdit">

    <h2 id="editTitle">Editar producto</h2>
    <input type="text"   id="editName"  placeholder="Nombre">
    <input type="number" id="editPrice" placeholder="Precio (ej: 3000)">
    <input type="text"   id="editDesc"  placeholder="Descripción (opcional)">
    <div class="top-toggle-row">
      <span>⭐ Badge TOP</span>
      <label class="switch"><input type="checkbox" id="editTop"><span class="slider"></span></label>
    </div>
    <button class="btn-y" onclick="confirmEdit()">Guardar cambios</button>
    <button class="btn-c" onclick="closeModal('mEdit')">Cancelar</button>
    <button class="btn-del" id="delBtn" onclick="deleteItem()">🗑 Eliminar producto</button>
  </div>
</div>

<!-- ADD ITEM MODAL -->
<div class="mbd" id="mAdd">
  <div class="mbox">
    <h2 id="addTitle">➕ Agregar producto</h2>
    <input type="text"   id="addName"  placeholder="Nombre del producto">
    <input type="number" id="addPrice" placeholder="Precio (ej: 3000)">
    <input type="text"   id="addDesc"  placeholder="Descripción (opcional)">
    <div class="top-toggle-row">
      <span>⭐ Badge TOP</span>
      <label class="switch"><input type="checkbox" id="addTop"><span class="slider"></span></label>
    </div>
    <button class="btn-y" onclick="confirmAdd()">Agregar</button>
    <button class="btn-c" onclick="closeModal('mAdd')">Cancelar</button>
  </div>
</div>

//  STATE
// ═══════════════════════════════════════════════
let menu    = JSON.parse(JSON.stringify(DEFAULT_MENU));
let isAdmin = false;
let tapCount = 0, tapTimer = null;
let editTarget = null; // {ci, si, ii}
let addTarget  = null; // {ci, si}

// ═══════════════════════════════════════════════
//  FIREBASE (REST API)
// ═══════════════════════════════════════════════
async function loadFirebase() {
  try {
    const r = await fetch(`${DB}/menu.json`);
    const d = await r.json();
    if (d && Array.isArray(d)) { menu = d; setStatus(true, 'En línea · Menú actualizado'); }
    else setStatus(true, 'En línea · Sin datos remotos aún');
  } catch { setStatus(false, 'Sin conexión · Usando menúlocal'); }
  renderAll(); hideLoading();
}

async function saveToFirebase() {
  const btn = document.getElementById('abSave');
  btn.textContent = '⏳ Guardando...';
  try {
    const r = await fetch(`${DB}/menu.json`, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(menu)
    });
    if (!r.ok) throw new Error(r.status);
    // Save timestamp
    await fetch(`${DB}/lastUpdated.json`, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(new Date().toISOString())
    });
    btn.textContent = '✅ Guardado';
    setStatus(true, 'En línea · Cambios guardados — todos ven el menú actualizado');
    setTimeout(()=>{ btn.textContent='💾 Guardar'; },2500);
  } catch {
    btn.textContent = '❌ Error';
    alert('No se pudo guardar. Verifica las reglas de Firebase:\n{\n  ".read": true,\n  ".write": true\n}');
    setTimeout(()=>{ btn.textContent='💾 Guardar'; },2500);
  }
}

// Poll every 45s so all viewers see changes
function startPoll() {
  setInterval(async ()=>{
    if (isAdmin) return;
    try {
      const r = await fetch(`${DB}/menu.json`);
      const d = await r.json();
      if (d && Array.isArray(d)) { menu=d; renderAll(); }
    } catch {}
  }, 45000);
}

// ═══════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════
const fmt = n => '$' + Number(n).toLocaleString('es-CL');

function renderAll() { renderNav(); renderMenu(); }

function renderNav() {
  document.getElementById('nav').innerHTML = menu.map((c,i)=>`
    <button class="nbtn${i===0?' on':''}" onclick="goSection('${c.id}',this)">

}

function renderMenu() {
  document.getElementById('main').innerHTML = menu.map((cat,ci)=>`
    <div class="section" id="s-${cat.id}">
      <div class="sec-hdr">
        <span class="sec-emoji">${cat.emoji}</span>
        <h2 class="sec-title">${cat.name}</h2>
      </div>
      ${cat.subcategories.map((sub,si)=>`
        <div class="sublabel">${sub.name}</div>
        ${sub.items.map((item,ii)=>`
          <div class="item">
            <div class="iL">
              <div class="inr">
                <span class="iname" onclick="openEdit(${ci},${si},${ii})">${item.name}</span>
                ${item.top?`<span class="tbadge" onclick="openEdit(${ci},${si},${ii})">★ TOP</span>`:''}
              </div>
              ${item.desc?`<div class="idesc">${item.desc}</div>`:''}
            </div>
            <span class="iprice" onclick="openEdit(${ci},${si},${ii})">${fmt(item.price)}</span>
          </div>`).join('')}
        <button class="add-item-btn" onclick="openAdd(${ci},${si})">＋ Agregar producto a ${sub.name}</button>
      `).join('')}
    </div>`).join('');
}

// ═══════════════════════════════════════════════
//  NAV / SCROLL
// ═══════════════════════════════════════════════
function goSection(id, btn) {
  const el = document.getElementById('s-'+id);
  if (!el) return;
  const navH = document.querySelector('.nav-wrap').offsetHeight + (isAdmin?44:0);
  window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - navH - 6, behavior:'smooth' });
  document.querySelectorAll('.nbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

window.addEventListener('scroll',()=>{
  const off = document.querySelector('.nav-wrap').offsetHeight + (isAdmin?44:0) + 20;
  let active = null;
  menu.forEach(c=>{ const e=document.getElementById('s-'+c.id); if(e&&e.getBoundingClientRect().top<off) active=c.id; });
  if (!active) return;
  document.querySelectorAll('.nbtn').forEach(b=>{
    const cat=menu.find(c=>c.id===active);
    b.classList.toggle('on', cat && b.textContent.includes(cat.name));
  });
},{passive:true});

function scrollTop() { window.scrollTo({top:0,behavior:'smooth'}); }

// ═══════════════════════════════════════════════
//  ADMIN
// ═══════════════════════════════════════════════
function adminTap() {
  tapCount++;
  clearTimeout(tapTimer);
  if (tapCount>=3) {
    tapCount=0;
    openModal('mPwd');
    setTimeout(()=>{ document.getElementById('pwdIn').focus(); },150);
  } else {
    tapTimer=setTimeout(()=>{ tapCount=0; },700);
  }
}

function checkPwd() {
  const v = document.getElementById('pwdIn').value;
  document.getElementById('pwdIn').value='';
  if (v===PWD) { closeModal('mPwd'); enterAdmin(); }
  else { document.getElementById('pwdErr').style.display='block'; setTimeout(()=>{ document.getElementById('pwdErr').style.display='none'; },2000); }
}

function enterAdmin() { isAdmin=true; document.body.classList.add('admin'); }
function exitAdmin()  { isAdmin=false; document.body.classList.remove('admin'); renderAll(); }

// ── EDIT ITEM ──
function openEdit(ci,si,ii) {
  if (!isAdmin) return;
  editTarget={ci,si,ii};
  const it=menu[ci].subcategories[si].items[ii];
  document.getElementById('editTitle').textContent = `✏️ ${it.name}`;
  document.getElementById('editName').value  = it.name;
  document.getElementById('editPrice').value = it.price;
  document.getElementById('editDesc').value  = it.desc||'';
  document.getElementById('editTop').checked = !!it.top;
  openModal('mEdit');
}

function confirmEdit() {
  if (!editTarget) return;
  const {ci,si,ii}=editTarget;
  const name  = document.getElementById('editName').value.trim();
  const price = parseInt(document.getElementById('editPrice').value);
  if (!name)      { alert('Ingresa un nombre'); return; }
  if (isNaN(price)||price<0) { alert('Precio inválido'); return; }
  menu[ci].subcategories[si].items[ii] = {
    name,
    price,
    desc:  document.getElementById('editDesc').value.trim(),
    top:   document.getElementById('editTop').checked,
  };
  closeModal('mEdit');
  renderMenu();
}

function deleteItem() {
  if (!editTarget) return;
  const {ci,si,ii}=editTarget;
  const name=menu[ci].subcategories[si].items[ii].name;
  if (!confirm(`¿Eliminar "${name}"?`)) return;
  menu[ci].subcategories[si].items.splice(ii,1);
  closeModal('mEdit');
  renderMenu();
}

// ── ADD ITEM ──
function openAdd(ci,si) {
  addTarget={ci,si};
  document.getElementById('addTitle').textContent = `➕ Agregar a ${menu[ci].subcategories[si].name}`;
  document.getElementById('addName').value='';
  document.getElementById('addPrice').value='';
  document.getElementById('addDesc').value='';
  document.getElementById('addTop').checked=false;
  openModal('mAdd');
}

function confirmAdd() {
  if (!addTarget) return;
  const name  = document.getElementById('addName').value.trim();
  const price = parseInt(document.getElementById('addPrice').value);
  if (!name)      { alert('Ingresa un nombre'); return; }
  if (isNaN(price)||price<0) { alert('Precio inválido'); return; }
  menu[addTarget.ci].subcategories[addTarget.si].items.push({
    name,
    price,
    desc: document.getElementById('addDesc').value.trim(),
    top:  document.getElementById('addTop').checked,
  });
  closeModal('mAdd');
  renderMenu();
}

// ═══════════════════════════════════════════════
//  MODALS
// ═══════════════════════════════════════════════
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.mbd').forEach(bd=>{
  bd.addEventListener('click',e=>{ if(e.target===bd) bd.classList.remove('open'); });
});

// ═══════════════════════════════════════════════
//  STATUS / LOADING
// ═══════════════════════════════════════════════
function setStatus(live,txt) {
  document.getElementById('sdot').className='sdot'+(live?' live':'');
  document.getElementById('statusTxt').textContent=txt;
}
function hideLoading() {
  const el=document.getElementById('loading');
  el.classList.add('gone');
  setTimeout(()=>el.remove(),500);
}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
(async()=>{
  renderAll();        // show default menu immediately
  await loadFirebase();
  startPoll();
})();
</script>
</body>
</html>
