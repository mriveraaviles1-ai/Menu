<style>
  :root {
    --negro:#0a0a0a; --negro2:#111111; --negro3:#1a1a1a;

    --gris:#888; --gris2:#444; --rojo:#ff4444; --verde:#44cc88;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--negro);color:var(--blanco);font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden;}

  header{background:var(--negro);border-bottom:2px solid var(--amarillo);padding:20px 20px 14px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 4px 30px rgba(255,229,0,0.12);}
  .header-top{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:4px;}
  .logo-circle{width:48px;height:48px;border-radius:50%;background:var(--amarillo);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--negro);flex-shrink:0;}
  .header-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,7vw,48px);letter-spacing:3px;color:var(--amarillo);text-shadow:0 0 30px rgba(255,229,0,0.35);}
  .header-sub{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:5px;color:var(--gris);text-transform:uppercase;margin-bottom:12px;}
  .horarios{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .horario-pill{background:var(--negro3);border:1px solid var(--gris2);border-radius:20px;padding:3px 12px;font-size:11px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;color:var(--gris);}
  .horario-pill span{color:var(--amarillo);font-weight:700;}

  .cat-nav{display:flex;gap:8px;padding:12px 14px;overflow-x:auto;background:var(--negro2);border-bottom:1px solid var(--negro3);scrollbar-width:none;}
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-btn{flex-shrink:0;background:var(--negro3);border:1px solid var(--gris2);color:var(--gris);padding:6px 14px;border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
  .cat-btn:hover,.cat-btn.active{background:var(--amarillo);border-color:var(--amarillo);color:var(--negro);font-weight:700;}

  main{padding:20px 16px 100px;max-width:640px;margin:0 auto;}
  .categoria{margin-bottom:36px;display:none;}
  .categoria.visible{display:block;animation:fadeUp 0.3s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .cat-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;color:var(--amarillo);border-bottom:1px solid var(--gris2);padding-bottom:8px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .subcat-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:3px;color:var(--gris2);text-transform:uppercase;margin:16px 0 4px;}

  .item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #1e1e1e;gap:10px;}
  .item:last-of-type{border-bottom:none;}
  .item-info{flex:1;}
  .item-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;color:var(--blanco);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .badge-top{background:var(--amarillo);color:var(--negro);font-size:9px;font-weight:700;letter-spacing:1px;padding:2px 6px;border-radius:4px;font-family:'Barlow Condensed',sans-serif;}
  .item-desc{font-size:12px;color:var(--gris);margin-top:2px;font-style:italic;}
  .item-price{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--amarillo);letter-spacing:1px;white-space:nowrap;}

  .admin-mode .item{background:rgba(255,229,0,0.02);border-radius:8px;padding:10px 8px;margin-bottom:4px;border:1px solid #222!important;}
  .admin-mode .item:hover{border-color:var(--gris2)!important;}
  .editable{background:transparent;border:none;color:inherit;font-family:inherit;font-size:inherit;font-weight:inherit;letter-spacing:inherit;display:inline;min-width:20px;}
  .editable[contenteditable="true"]:focus{background:rgba(255,229,0,0.08);border-radius:4px;outline:2px solid var(--amarillo);padding:2px 6px;}
  .editable-price{background:transparent;border:none;font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--amarillo);letter-spacing:1px;min-width:60px;text-align:right;}
  .editable-price[contenteditable="true"]:focus{background:rgba(255,229,0,0.08);border-radius:4px;outline:2px solid var(--amarillo);padding:2px 4px;}

  .item-actions{display:none;gap:6px;margin-left:6px;flex-shrink:0;}
  .admin-mode .item-actions{display:flex;}
  .btn-icon{background:none;border:1px solid #333;color:var(--gris2);width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;}
  .btn-icon.del:hover{border-color:var(--rojo);color:var(--rojo);}
  .btn-icon.top.on,.btn-icon.top:hover{border-color:var(--amarillo);color:var(--amarillo);}

  .btn-add-item{display:none;width:100%;margin-top:10px;background:rgba(255,229,0,0.04);border:1px dashed var(--gris2);color:var(--gris);padding:10px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer;transition:all 0.2s;}
  .admin-mode .btn-add-item{display:block;}
  .btn-add-item:hover{border-color:var(--amarillo);color:var(--amarillo);}

  .admin-bar{display:none;position:fixed;top:0;left:0;right:0;z-index:500;background:#0f0f0f;border-bottom:2px solid var(--amarillo);padding:8px 16px;align-items:center;gap:10px;}
  .admin-bar.on{display:flex;}
  .admin-bar-title{font-family:'Bebas Neue',sans-serif;font-size:17px;color:var(--amarillo);letter-spacing:2px;flex:1;}
  .btn-guardar{background:var(--amarillo);color:var(--negro);border:none;padding:7px 20px;border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;cursor:pointer;}
  .btn-guardar:hover{background:#fff;}
  .btn-salir{background:none;border:1px solid var(--gris2);color:var(--gris);padding:7px 14px;border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-size:13px;cursor:pointer;}
  .btn-salir:hover{border-color:var(--rojo);color:var(--rojo);}
  .save-ok{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--verde);letter-spacing:1px;opacity:0;transition:opacity 0.3s;}
  .save-ok.on{opacity:1;}

  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:600;align-items:center;justify-content:center;}
  .modal-bg.on{display:flex;}
  .modal{background:var(--negro2);border:1px solid var(--gris2);border-radius:16px;padding:32px 28px;width:90%;max-width:320px;text-align:center;}
  .modal h2{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--amarillo);letter-spacing:3px;margin-bottom:6px;}
  .modal p{font-size:13px;color:var(--gris);margin-bottom:20px;}
  .modal input[type=password]{width:100%;background:var(--negro3);border:1px solid var(--gris2);color:var(--blanco);padding:12px 16px;border-radius:10px;font-family:'Barlow',sans-serif;font-size:15px;outline:none;margin-bottom:10px;}
  .modal input[type=password]:focus{border-color:var(--amarillo);}
  .btn-login{width:100%;background:var(--amarillo);color:var(--negro);border:none;padding:12px;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;}
  .btn-login:hover{background:#fff;}
  .modal-err{color:var(--rojo);font-size:12px;margin-top:6px;min-height:16px;}
  .btn-cancelar{background:none;border:none;color:var(--gris);font-size:12px;cursor:pointer;margin-top:10px;font-family:'Barlow',sans-serif;text-decoration:underline;display:block;margin-inline:auto;}

  .loading{text-align:center;padding:60px 20px;font-family:'Barlow Condensed',sans-serif;color:var(--gris);letter-spacing:2px;font-size:14px;}
  .loading-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amarillo);margin:0 3px;animation:bounce 1s infinite;}
  .loading-dot:nth-child(2){animation-delay:0.2s;}
  .loading-dot:nth-child(3){animation-delay:0.4s;}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  footer{text-align:center;padding:20px;font-size:11px;color:var(--gris2);font-family:'Barlow Condensed',sans-serif;letter-spacing:2px;border-top:1px solid #1a1a1a;}
  footer strong{color:var(--amarillo);}
  .back-top{position:fixed;bottom:20px;right:20px;background:var(--amarillo);color:var(--negro);border:none;width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(255,229,0,0.35);z-index:200;}
  .back-top.on{display:flex;}
  .admin-toggle{position:fixed;bottom:20px;left:20px;z-index:300;background:var(--negro3);border:1px solid var(--gris2);color:var(--gris);width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
  .admin-toggle:hover{border-color:var(--amarillo);color:var(--amarillo);}
  body.admin-on{padding-top:48px;}
</style>
</head>

function renderMenu(data) {
  const main = document.getElementById('menuMain');
  let html = '';
  data.categorias.forEach(cat => {
    const vis = (catActiva==='todo' || catActiva===cat.id) ? 'visible' : '';
    html += `<section class="categoria ${vis}" data-cat="${cat.id}" id="sec-${cat.id}">`;
    html += `<div class="cat-title"><span>${cat.icon}</span> ${cat.nombre}</div>`;
    cat.subcats.forEach(sub => {
      if (sub.label) html += `<div class="subcat-label">${sub.label}</div>`;
      (sub.items||[]).forEach(item => {
        html += `<div class="item" data-id="${item.id}">
          <div class="item-info">
            <div class="item-name">
              <span class="editable">${item.nombre}</span>
              <span class="badge-top" style="display:${item.top?'inline':'none'}">★ TOP</span>
            </div>
            ${item.desc?`<div class="item-desc">${item.desc}</div>`:''}
          </div>
          <div class="item-price"><span class="editable-price">${item.precio}</span></div>
          <div class="item-actions">
            <button class="btn-icon top ${item.top?'on':''}" onclick="toggleTop(this)">★</button>
            <button class="btn-icon del" onclick="delItem(this)">✕</button>
          </div>
        </div>`;
      });
    });
    html += `<button class="btn-add-item" onclick="addItem('sec-${cat.id}')">+ Agregar producto</button>`;
    html += `</section>`;
  });
  main.innerHTML = html;
  if (adminActivo) activarEdicion();
}

async function cargarMenu() {
  // Mostrar menú inicial de inmediato (sin esperar red)
  renderMenu(menuInicial);
  try {
    const snap = await menuRef.get();
    if (snap.exists()) {
      renderMenu(snap.val());
    } else {
      await menuRef.set(menuInicial);
    }
    // Escuchar cambios en tiempo real (para otros dispositivos)
    menuRef.on('value', snap => {
      if (snap.exists() && !adminActivo) renderMenu(snap.val());
    });
  } catch(e) {
    // Si falla Firebase, el menú inicial ya está visible — no hacer nada
    console.warn('Firebase no disponible, mostrando menú local.', e);
  }
}

function leerMenuDOM() {
  const categorias = [];
  document.querySelectorAll('.categoria').forEach(sec => {
    const titleEl = sec.querySelector('.cat-title');
    const icon = titleEl.querySelector('span')?.textContent || '';
    const nombre = titleEl.textContent.replace(icon,'').trim();
    const cat = { id: sec.dataset.cat, icon, nombre, subcats: [] };
    let sub = { label: null, items: [] };
    Array.from(sec.children).forEach(el => {
      if (el.classList.contains('subcat-label')) {
        if (sub.items.length) cat.subcats.push(sub);
        sub = { label: el.textContent, items: [] };
      } else if (el.classList.contains('item')) {
        const topBtn = el.querySelector('.btn-icon.top');
        const descEl = el.querySelector('.item-desc');
        const item = {
          id: el.dataset.id || ('n'+N++),
          nombre: el.querySelector('.editable')?.textContent || '',
          precio: el.querySelector('.editable-price')?.textContent || '',
          top: topBtn?.classList.contains('on') || false
        };
        if (descEl) item.desc = descEl.textContent;
        sub.items.push(item);
      }
    });
    if (sub.items.length) cat.subcats.push(sub);
    categorias.push(cat);
  });
  return { categorias };
}

window.guardar = async function() {
  try {
    await menuRef.set(leerMenuDOM());
    const m = document.getElementById('saveOk');
    m.classList.add('on');
    setTimeout(()=>m.classList.remove('on'), 2500);
  } catch(e) { alert('Error al guardar. Verifica conexión.'); }
};

window.filtrar = function(cat, btn) {
  catActiva = cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.categoria').forEach(s=>s.classList.toggle('visible', cat==='todo'||s.dataset.cat===cat));
  window.scrollTo({top:0,behavior:'smooth'});
};

window.abrirModal = function() { document.getElementById('modalBg').classList.add('on'); setTimeout(()=>document.getElementById('pwInput').focus(),80); };
window.cerrarModal = function() { document.getElementById('modalBg').classList.remove('on'); document.getElementById('pwInput').value=''; document.getElementById('modalErr').textContent=''; };
window.login = function() {
  if (document.getElementById('pwInput').value===PW) { cerrarModal(); activarAdmin(); }
  else { document.getElementById('modalErr').textContent='Clave incorrecta'; document.getElementById('pwInput').value=''; document.getElementById('pwInput').focus(); }
};

function activarAdmin() {
  adminActivo=true;
  document.getElementById('adminBar').classList.add('on');
  document.getElementById('adminToggle').style.display='none';
  document.getElementById('menuMain').classList.add('admin-mode');
  document.body.classList.add('admin-on');
  activarEdicion();
}
function activarEdicion() {
  document.querySelectorAll('.editable,.editable-price').forEach(el=>el.contentEditable='true');
}
window.salirAdmin = function() {
  adminActivo=false;
  document.getElementById('adminBar').classList.remove('on');
  document.getElementById('adminToggle').style.display='flex';
  document.getElementById('menuMain').classList.remove('admin-mode');
  document.body.classList.remove('admin-on');
  document.querySelectorAll('.editable,.editable-price').forEach(el=>el.contentEditable='false');
};

window.toggleTop = function(btn) {
  const item = btn.closest('.item');
  const badge = item.querySelector('.badge-top');
  const isOn = btn.classList.toggle('on');
  if (badge) badge.style.display = isOn?'inline':'none';
};
window.delItem = function(btn) { if(confirm('¿Eliminar este producto?')) btn.closest('.item').remove(); };
window.addItem = function(secId) {
  const sec = document.getElementById(secId);
  const btnAdd = sec.querySelector('.btn-add-item');
  const d = document.createElement('div');
  d.className='item'; d.dataset.id='n'+(N++);
  d.innerHTML=`
    <div class="item-info"><div class="item-name"><span class="editable" contenteditable="true">Nuevo producto</span><span class="badge-top" style="display:none">★ TOP</span></div></div>
    <div class="item-price"><span class="editable-price" contenteditable="true">$0</span></div>
    <div class="item-actions">
      <button class="btn-icon top" onclick="toggleTop(this)">★</button>
      <button class="btn-icon del" onclick="delItem(this)">✕</button>
    </div>`;
  sec.insertBefore(d, btnAdd);
  setTimeout(()=>d.querySelector('.editable').focus(),50);
};

window.addEventListener('scroll',()=>document.getElementById('backTop').classList.toggle('on',scrollY>200));
cargarMenu();
</script>
</body>
</html>
